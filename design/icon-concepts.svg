<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="52%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="basicGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#16a34a"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="softGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feColorMatrix in="blur" type="matrix" values="0 0 0 0 0.13 0 0 0 0 0.82 0 0 0 0 0.93 0 0 0 .5 0"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; }
      .page-bg { fill: #07090f; }
      .title { fill: #f8fafc; font-size: 34px; font-weight: 900; }
      .subtitle { fill: #94a3b8; font-size: 16px; font-weight: 600; }
      .card { fill: #0f172a; stroke: rgba(148,163,184,.22); stroke-width: 1; }
      .label { fill: #e2e8f0; font-size: 18px; font-weight: 900; }
      .desc { fill: #94a3b8; font-size: 13px; font-weight: 600; }
      .size-label { fill: #64748b; font-size: 11px; font-weight: 800; }
      .app-bg { fill: #05070b; }
      .p-white { fill: #f8fafc; font-weight: 900; }
      .p-dark { fill: #020617; font-weight: 900; }
      .small-bg { fill: #111827; stroke: rgba(148,163,184,.25); stroke-width: 1; }
    </style>
  </defs>

  <rect class="page-bg" width="1160" height="760"/>
  <text x="44" y="58" class="title">Prompt &amp; Play Studio - Icon Concepts</text>
  <text x="44" y="88" class="subtitle">พรีวิวแยกก่อนแทนไฟล์จริง: เทียบแบบ 128px / 48px / 32px / 16px เพื่อดูว่าอันไหนอ่านออกในแถบ extension</text>

  <!-- Concept A -->
  <g transform="translate(44 132)">
    <rect class="card" width="208" height="560" rx="18"/>
    <text x="20" y="36" class="label">A. Big P Play</text>
    <text x="20" y="60" class="desc">P ใหญ่เต็มเฟรม</text>
    <g transform="translate(40 88)">
      <rect width="128" height="128" rx="28" fill="#05070b"/>
      <rect x="7" y="7" width="114" height="114" rx="24" fill="#0b1020" stroke="url(#brandGrad)" stroke-width="6"/>
      <text x="63" y="94" text-anchor="middle" font-size="108" class="p-white">P</text>
      <circle cx="72" cy="49" r="20" fill="#07111f" stroke="#22d3ee" stroke-width="4"/>
      <path d="M67 38 L84 49 L67 60 Z" fill="url(#brandGrad)"/>
    </g>
    <g transform="translate(35 254)">
      <rect class="small-bg" width="138" height="220" rx="14"/>
      <use href="#aIcon" transform="translate(18 18) scale(.375)"/>
      <use href="#aIcon" transform="translate(72 26) scale(.25)"/>
      <use href="#aIcon" transform="translate(108 34) scale(.125)"/>
      <text x="18" y="190" class="size-label">48px / 32px / 16px</text>
    </g>
  </g>

  <!-- Concept B -->
  <g transform="translate(276 132)">
    <rect class="card" width="208" height="560" rx="18"/>
    <text x="20" y="36" class="label">B. P Spark Badge</text>
    <text x="20" y="60" class="desc">P สว่าง + sparkle</text>
    <g transform="translate(40 88)">
      <rect width="128" height="128" rx="30" fill="#05070b"/>
      <rect x="10" y="10" width="108" height="108" rx="24" fill="#111827" stroke="url(#brandGrad)" stroke-width="5"/>
      <circle cx="94" cy="32" r="7" fill="#67e8f9"/>
      <path d="M34 96 C50 86 81 86 96 96" fill="none" stroke="#8b5cf6" stroke-width="7" stroke-linecap="round"/>
      <text x="64" y="84" text-anchor="middle" font-size="82" class="p-white">P</text>
    </g>
  </g>

  <!-- Concept C -->
  <g transform="translate(508 132)">
    <rect class="card" width="208" height="560" rx="18"/>
    <text x="20" y="36" class="label">C. Gradient Block</text>
    <text x="20" y="60" class="desc">ชัดสุดตอนเล็ก</text>
    <g transform="translate(40 88)">
      <rect width="128" height="128" rx="28" fill="url(#brandGrad)"/>
      <rect x="10" y="10" width="108" height="108" rx="22" fill="rgba(255,255,255,.10)"/>
      <text x="64" y="86" text-anchor="middle" font-size="88" class="p-dark">P</text>
      <circle cx="94" cy="34" r="6" fill="#020617"/>
    </g>
  </g>

  <!-- Concept D -->
  <g transform="translate(740 132)">
    <rect class="card" width="208" height="560" rx="18"/>
    <text x="20" y="36" class="label">D. Prompt Cursor</text>
    <text x="20" y="60" class="desc">P + เส้น prompt</text>
    <g transform="translate(40 88)">
      <rect width="128" height="128" rx="28" fill="#05070b"/>
      <rect x="8" y="8" width="112" height="112" rx="23" fill="#0b1020" stroke="url(#basicGrad)" stroke-width="5"/>
      <text x="63" y="78" text-anchor="middle" font-size="78" class="p-white">P</text>
      <rect x="36" y="94" width="56" height="7" rx="3.5" fill="#22d3ee"/>
      <rect x="96" y="92" width="5" height="11" rx="2" fill="#f8fafc"/>
    </g>
  </g>

  <!-- Concept E -->
  <g transform="translate(972 132)">
    <rect class="card" width="144" height="560" rx="18"/>
    <text x="18" y="36" class="label" font-size="16">E. PP Mark</text>
    <text x="18" y="60" class="desc">monogram</text>
    <g transform="translate(8 88)">
      <rect width="128" height="128" rx="28" fill="#05070b"/>
      <rect x="8" y="8" width="112" height="112" rx="23" fill="#0b1020" stroke="url(#brandGrad)" stroke-width="5"/>
      <text x="52" y="84" text-anchor="middle" font-size="78" class="p-white">P</text>
      <text x="78" y="88" text-anchor="middle" font-size="64" fill="#67e8f9" font-weight="900">P</text>
    </g>
  </g>

  <!-- Symbols for scaled preview -->
  <symbol id="aIcon" viewBox="0 0 128 128">
    <rect width="128" height="128" rx="28" fill="#05070b"/>
    <rect x="7" y="7" width="114" height="114" rx="24" fill="#0b1020" stroke="url(#brandGrad)" stroke-width="6"/>
    <text x="63" y="94" text-anchor="middle" font-size="108" class="p-white">P</text>
    <circle cx="72" cy="49" r="20" fill="#07111f" stroke="#22d3ee" stroke-width="4"/>
    <path d="M67 38 L84 49 L67 60 Z" fill="url(#brandGrad)"/>
  </symbol>

  <text x="44" y="724" fill="#cbd5e1" font-size="15" font-weight="700">คำแนะนำ: ถ้าอยากให้ extension bar อ่านง่ายสุด ให้เลือก A หรือ C. ถ้าอยากให้ดูแบรนด์พรีเมียมขึ้น เลือก B.</text>
</svg>
